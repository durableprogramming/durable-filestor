[workspace]
members = [
    "apps/core",
    "apps/core/config_toml_parser",
    "apps/core/config_uri_parser",
    "apps/core/uri_parser",
    "apps/core/config_toml_exporter",
    "apps/core/config_uri_exporter",
    "apps/services/*",
    "apps/shared"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Durable Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/durable-filestor"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.0", features = ["derive", "env"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

